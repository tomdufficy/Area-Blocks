<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Area Blocks</title>
<style>
  :root{
    --bg:#f6f6f3;
    --panel:#ffffff;
    --ink:#171717;
    --muted:#777;
    --line:#deded8;
    --cell:18px;
    --stage-pad:42px;
    --sidebar:420px;
    --stage-bg:#f6f6f3;
    --dot:#b8b8b1;
    --button:#ffffff;
    --button-hover:#f2f2ef;
  }

  body.night{
    --bg:#1c2633;
    --panel:#243141;
    --ink:#e8edf3;
    --muted:#aab6c3;
    --line:#3a495a;
    --stage-bg:#1b2532;
    --dot:#5d6b7b;
    --button:#2a394a;
    --button-hover:#314255;
  }

  *{box-sizing:border-box}
  html,body{
    height:100%;margin:0;
    font:14px/1.35 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);background:var(--bg)
  }
  button,input{font:inherit}
  button{cursor:pointer}

  .app{
    height:100%;
    display:grid;
    grid-template-columns:var(--sidebar) 6px 1fr;
  }

  aside{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
    z-index:2;
  }

  .head{
    padding:18px;
    border-bottom:1px solid var(--line);
  }

  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px}

  .controls{
    padding:14px 18px;
    display:grid;
    gap:10px;
    border-bottom:1px solid var(--line);
  }

  .sectionLabel{
    margin-top:2px;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:#999;
  }

  .row{display:flex;gap:8px;align-items:center}
  .row > *{min-width:0}
  .grow{flex:1}

  label.small{
    color:var(--muted);
    font-size:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }

  input[type="number"], input[type="text"]{
    width:100%;
    border:1px solid var(--line);
    border-radius:7px;
    padding:7px 8px;
    background:var(--button);
    color:var(--ink);
  }

  input[type="color"]{
    width:34px;height:34px;padding:2px;
    border:1px solid var(--line);
    border-radius:7px;background:#fff;
  }

  input[type="range"]{accent-color:#333}

  .hex{
    text-transform:uppercase;
    font-size:12px;
    letter-spacing:.02em;
  }

  .smallNumber{
    width:64px !important;
    text-align:right;
    padding:5px 6px !important;
  }

  .btn{
    border:1px solid var(--line);
    background:var(--button);
    border-radius:7px;
    padding:8px 10px;
  }
  .btn:hover{background:var(--button-hover)}
  .btn.primary{background:#171717;color:white;border-color:#171717}

  #items{
    flex:1;
    overflow:auto;
    padding:10px;
  }

  .item{
    display:grid;
    grid-template-columns:34px minmax(90px,1fr) 102px 34px 30px;
    gap:7px;
    align-items:center;
    padding:8px;
    border-bottom:1px solid #eeeeea;
  }

  .item .areaWrap{position:relative}
  .item .areaWrap::after{
    content:"m²";
    position:absolute;right:7px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--muted);pointer-events:none
  }
  .item .area{padding-right:26px;font-variant-numeric:tabular-nums}


  .colourControl{position:relative}
  .colourSwatchBtn{
    width:34px;
    height:34px;
    border:1px solid var(--line);
    border-radius:7px;
    padding:3px;
    background:var(--button);
  }
  .colourSwatchInner{
    width:100%;
    height:100%;
    border-radius:4px;
    border:1px solid rgba(0,0,0,.08);
  }
  .colourPopover{
    position:absolute;
    top:40px;
    left:0;
    z-index:100;
    width:190px;
    padding:10px;
    display:none;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
    box-shadow:0 8px 24px rgba(0,0,0,.16);
  }
  .colourPopover.open{display:grid}
  .colourPopover input[type="color"]{
    width:100%;
    height:38px;
  }
  .colourPopover .hex{
    width:100%;
  }

  .textToneBtn{
    width:34px;
    height:34px;
    padding:0;
    border:1px solid var(--line);
    background:var(--button);
    border-radius:7px;
    display:grid;
    place-items:center;
  }
  .textToneBtn:hover{background:var(--button-hover)}
  .textToneDot{
    width:15px;
    height:15px;
    border-radius:50%;
    border:1px solid rgba(127,127,127,.55);
  }

  .delete{
    border:0;background:transparent;font-size:18px;color:#999;padding:0
  }
  .delete:hover{color:#222}

  .footer{
    padding:12px 18px 16px;
    border-top:1px solid var(--line);
    display:grid;
    gap:8px;
  }

  main{
    min-width:0;
    min-height:0;
    overflow:auto;
    position:relative;
    background:var(--stage-bg);
  }

  #resizer{
    width:6px;
    cursor:col-resize;
    background:transparent;
    position:relative;
    z-index:4;
  }
  #resizer::after{
    content:"";
    position:absolute;
    top:0;bottom:0;
    left:2px;
    width:1px;
    background:var(--line);
  }
  #resizer:hover::after{width:2px;left:2px}

  #gridSurface{
    position:relative;
    min-width:100%;
    min-height:100%;
    width:max-content;
    height:max-content;
    padding:var(--stage-pad);

    /* App-only dot matrix. Its first dot is exactly the stage origin. */
    background-image:radial-gradient(circle, var(--dot) 0.7px, transparent 0.8px);
    background-size:var(--cell) var(--cell);
    background-position:var(--stage-pad) var(--stage-pad);
    background-repeat:repeat;
    background-origin:border-box;
  }

  #stage{
    position:relative;
    min-width:700px;
    min-height:520px;
  }

  .room{
    position:absolute;
    pointer-events:none;
    transition:left .18s ease,top .18s ease;
  }

  .pixel{position:absolute}

  .pixel.gridOn{
    border-right:0.5px solid rgba(35,35,35,.24);
    border-bottom:0.5px solid rgba(35,35,35,.24);
  }

  .roomLabel{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:7px;
    pointer-events:none;
  }
  .roomLabel .name{font-weight:650}
  .roomLabel .sqm{font-size:12px;opacity:.72;margin-top:2px}

  .empty{
    position:absolute;inset:0;
    display:grid;place-items:center;
    color:#8a8a84;
    pointer-events:none
  }



  body.night .btn{
    background:#314255;
    color:#eef3f8;
    border-color:#53677d;
  }
  body.night .btn:hover{
    background:#3a4d62;
    border-color:#647a92;
  }
  body.night .btn.primary{
    background:#4b6685;
    color:#ffffff;
    border-color:#6e88a6;
  }
  body.night .btn.primary:hover{
    background:#587493;
  }

  #themeToggle{
    position:fixed;
    top:14px;
    right:14px;
    z-index:9999;
    width:44px;
    height:44px;
    border:1px solid #3f6485;
    border-radius:12px;
    background:#29445f;
    color:#ffffff;
    display:grid;
    place-items:center;
    padding:0;
    font-size:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
  }
  #themeToggle:hover{background:#355773}
  body.night #themeToggle{
    background:#d7e3ef;
    border-color:#8ba0b8;
    color:#24384e;
  }
  body.night #themeToggle:hover{background:#c6d7e7}

  /* Palette chooser */
  .paletteWrap{position:relative}
  .paletteButton{
    width:100%;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
    text-align:left;
  }
  .paletteButtonMain{
    display:grid;
    gap:5px;
  }
  .paletteName{font-size:12px;color:#444}
  .swatches{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    height:13px;
    overflow:hidden;
    border-radius:4px;
    border:1px solid rgba(0,0,0,.08);
  }
  .swatch{min-width:0}
  .chev{color:#777;font-size:11px}

  .paletteMenu{
    position:absolute;
    left:0;right:0;
    top:calc(100% + 5px);
    z-index:30;
    background:var(--button);
    border:1px solid var(--line);
    border-radius:9px;
    box-shadow:0 8px 26px rgba(0,0,0,.12);
    padding:6px;
    max-height:310px;
    overflow:auto;
    display:none;
  }
  .paletteMenu.open{display:block}

  .paletteOption{
    width:100%;
    border:0;
    background:var(--button);
    padding:8px;
    border-radius:6px;
    display:grid;
    gap:5px;
    text-align:left;
  }
  .paletteOption:hover{background:var(--button-hover)}
  .paletteOption.active{background:var(--button-hover)}
  .paletteOptionName{font-size:12px;font-weight:600}

  .pasteDialog{
    width:min(560px,calc(100vw - 32px));
    border:1px solid var(--line);
    border-radius:10px;
    padding:0;
    background:var(--panel);
    color:var(--ink);
    box-shadow:0 14px 40px rgba(0,0,0,.22);
  }
  .pasteDialog::backdrop{background:rgba(0,0,0,.28)}
  .pasteDialogInner{padding:16px;display:grid;gap:10px}
  .pasteDialog textarea{
    width:100%;min-height:220px;resize:vertical;
    border:1px solid var(--line);border-radius:7px;padding:9px;
    background:var(--button);color:var(--ink);font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside{border-right:0;border-bottom:1px solid var(--line);max-height:58vh}
    #resizer{display:none}
    #gridSurface{
      --stage-pad:24px;
    }
  }
</style>
</head>
<body>
<button id="themeToggle" title="Toggle night mode" aria-label="Toggle night mode">◐</button>
<div class="app">
  <aside>
    <div class="head">
      <h1>Area Blocks</h1>
      <div class="sub">1 grid cell = 1 m²</div>
    </div>

    <div class="controls">
      <button class="btn primary" id="addBtn">+ Add item</button>

      <div class="row">
        <button class="btn grow" id="shuffleBtn">Shuffle layout + shapes</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>

      <div class="sectionLabel">Colours</div>
      <div class="paletteWrap">
        <button class="btn paletteButton" id="paletteButton">
          <div class="paletteButtonMain">
            <div class="paletteName" id="paletteName">Random Soft</div>
            <div class="swatches" id="palettePreview"></div>
          </div>
          <span class="chev">▼</span>
        </button>
        <div class="paletteMenu" id="paletteMenu"></div>
      </div>
      <button class="btn" id="shuffleColoursBtn">Shuffle colours</button>

      <label class="small">
        Gap
        <input id="gapSlider" type="range" min="0" max="10" step="0.1" value="2.0" class="grow">
        <input id="gapNumber" class="smallNumber" type="number" min="0" max="10" step="0.1" value="2.0">
      </label>

      <label class="small">
        Display cell size
        <input id="cellInput" type="range" min="10" max="30" step="1" value="18" class="grow">
        <span id="cellValue">18 px</span>
      </label>

      <div class="sectionLabel">Display</div>
      <label class="small">
        <input id="displayGridInput" type="checkbox">
        Show grid
      </label>
      <label class="small">
        <input id="invertGridInput" type="checkbox">
        Invert grid colour
      </label>
      <label class="small">
        <input id="displayTextInput" type="checkbox" checked>
        Show text
      </label>

      <div class="sectionLabel">Export</div>
      <label class="small">
        <input id="exportGridInput" type="checkbox">
        Include grid
      </label>
      <label class="small">
        <input id="exportTextInput" type="checkbox">
        Include text
      </label>
    </div>

    <div id="items"></div>

    <div class="footer">
      <div class="row">
        <button class="btn grow" id="saveStateBtn">Save state</button>
        <button class="btn grow" id="loadStateBtn">Load state</button>
        <button class="btn grow" id="resetAppBtn">Reset app</button>
        <input id="loadStateInput" type="file" accept="application/json,.json" hidden>
      </div>
      <div class="row">
        <button class="btn grow" id="importCsvBtn">Import CSV</button>
        <button class="btn grow" id="pasteSpreadsheetBtn">Paste spreadsheet data</button>
      </div>
      <input id="importCsvInput" type="file" accept="text/csv,.csv" hidden>
      <button class="btn" id="exportTogether">Export current layout SVG</button>
      <button class="btn" id="exportSeparate">Export separate SVGs</button>
      <button class="btn" id="exportTogetherJpg">Export current layout JPG</button>
      <button class="btn" id="exportSeparateJpg">Export separate JPGs</button>
    </div>
  </aside>

  <dialog id="pasteSpreadsheetDialog" class="pasteDialog">
    <div class="pasteDialogInner">
      <strong>Paste spreadsheet data</strong>
      <div class="sub">Copy rows from Excel or Google Sheets: room name, area, optional hex colour. No headings.</div>
      <textarea id="pasteSpreadsheetText" placeholder="General Teaching    1800    #F8ABAD
Specialist Teaching    408"></textarea>
      <div class="row">
        <button class="btn grow" id="cancelPasteBtn">Cancel</button>
        <button class="btn primary grow" id="importPasteBtn">Import</button>
      </div>
    </div>
  </dialog>

  <div id="resizer" aria-hidden="true"></div>

  <main>
    <div id="gridSurface">
      <div id="stage">
        <div class="empty" id="emptyState">Add an item to begin</div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const PALETTES = [
    {id:'random', name:'Random Soft', colors:null},
    {id:'fjord-clay', name:'Fjord Clay', colors:['#0a2d2e','#1c4e4f','#436e6f','#6a8e8f','#879693','#a49e97','#deae9f','#efd7cf','#f7ebe7','#ffffff']},
    {id:'candy-glass', name:'Candy Glass', colors:['#ffadad','#ffd6a5','#fdffb6','#caffbf','#96e8ff','#a0c4ff','#bdb2ff','#debcff','#ffc6ff','#ffa7dc']},
    {id:'dusty-rose', name:'Dusty Rose', colors:['#c7a5aa','#b19297','#9c8185','#877074','#735e62','#5e4d50','#4a3c3f','#352b2d','#21191c','#0c080a']},
    {id:'twilight-lilac', name:'Twilight Lilac', colors:['#6886af','#d7adbe','#ab94b0','#116594','#242d62','#585387','#adb7dc','#b6c6db','#82465c','#c56477']},
    {id:'harvest', name:'Harvest', colors:['#c7522a','#cb6036','#cf6e41','#d68a58','#dea66f','#e5c185','#f0daa5','#fbf2c4','#dae0b8','#b8cdab']},
    {id:'atlantic-blue', name:'Atlantic Blue', colors:['#062456','#1d3867','#334d77','#4a6188','#627799','#7a8ca9','#93a2ba','#adb9cb','#c8d0dc','#e3e7ee']},
    {id:'mint-coral', name:'Mint Coral', colors:['#8aeba9','#82c09f','#7a9494','#8b8895','#9b7b96','#bc7d8a','#de8891','#ff9397','#ff9a80','#ffa780']},
    {id:'terracotta-coast', name:'Terracotta Coast', colors:['#264653','#287271','#2a9d8f','#8ab17d','#e9c46a','#f4a261','#ec8151','#e36040','#bc6b85','#9576c9']},
    {id:'forest-depths', name:'Forest Depths', colors:['#42826c','#38705d','#2f5f4e','#254e40','#1c3e32','#142f25','#0b2019','#05120d','#010604','#000100']},
    {id:'monochrome', name:'Monochrome', colors:['#000000','#101010','#202020','#404040','#606060','#808080','#c0c0c0','#e0e0e0','#f0f0f0','#ffffff']},
    {id:'spectrum', name:'Spectrum', colors:['#f65356','#fb8066','#fea671','#fec979','#feea80','#d7e586','#a5de94','#5daad8','#8187c7','#c56bba']},
    {id:'prism-pastel', name:'Prism Pastel', colors:['#ef8d88','#ffadad','#ffd6a5','#fdffb6','#caffbf','#14d1c1','#9bf6ff','#a0c4ff','#bdb2ff','#ffc6ff']},
    {id:'jade-fade', name:'Jade Fade', colors:['#2e2d2c','#3a4643','#44625c','#4c7d73','#569a8c','#5cb9a6','#60d9c3','#b1ece0','#d7f5ef','#ecfaf6']},
    {id:'studio-mix', name:'Studio Mix', colors:['#c7522a','#e5c185','#fbf2c4','#b8cdab','#74a892','#008585','#4c9eb3','#abbdec','#cac7ff','#e4d3fc']},
    {id:'moss-linen', name:'Moss Linen', colors:['#f1ddbf','#cabead','#a29e9a','#525e75','#657980','#78938a','#85a78e','#92ba92','#aeccae','#c9ddc9']},
    {id:'vintage-field', name:'Vintage Field', colors:['#463c57','#545d6b','#4d7159','#748b5d','#95a269','#b6ae71','#b68663','#b63b49','#98062d','#800022']},
    {id:'plum-sand', name:'Plum Sand', colors:['#660e60','#893f71','#924b76','#9b577a','#ac6f82','#be888b','#cfa093','#e1b89c','#eac4a0','#f3d0a4']},
    {id:'burnt-harvest', name:'Burnt Harvest', colors:['#a85633','#cf6e41','#d37c4d','#d68a58','#dea66f','#e5c185','#f0daa5','#fbf2c4','#dae0b8','#b8cdab']},
    {id:'sandstone', name:'Sandstone', colors:['#f3d0a4','#edcaa0','#e8c49b','#e3bf97','#deb993','#d9b38f','#d4ae8b','#cfa887','#caa383','#c59d7f']},
    {id:'atelier-earth', name:'Atelier Earth', colors:['#a3a094','#262b27','#55685b','#d6dce1','#dcbda1','#5c392f','#705438','#8c6c50','#d8d5c5','#3c6454']}
  ];

  const itemsEl = document.getElementById('items');
  const stage = document.getElementById('stage');
  const emptyState = document.getElementById('emptyState');

  const gapSlider = document.getElementById('gapSlider');
  const gapNumber = document.getElementById('gapNumber');
  const cellInput = document.getElementById('cellInput');
  const cellValue = document.getElementById('cellValue');

  const displayGridInput = document.getElementById('displayGridInput');
  const invertGridInput = document.getElementById('invertGridInput');
  const displayTextInput = document.getElementById('displayTextInput');
  const exportGridInput = document.getElementById('exportGridInput');
  const exportTextInput = document.getElementById('exportTextInput');

  const paletteButton = document.getElementById('paletteButton');
  const paletteName = document.getElementById('paletteName');
  const palettePreview = document.getElementById('palettePreview');
  const paletteMenu = document.getElementById('paletteMenu');

  let items = [];
  let arrangement = [];
  let layoutBounds = {maxX:0,maxY:0};
  let layoutDirty = true;
  let nextId = 1;
  let shuffleSeed = Math.random();
  let activePaletteId = 'random';
  let activeColourSequence = [];
  let restoringState = false;

  const STATE_KEY = 'area-blocks-state-v1';
  const STATE_VERSION = 1;

  function paletteById(id){
    return PALETTES.find(p=>p.id===id) || PALETTES[0];
  }

  function hexToRgb(hex){
    return [
      parseInt(hex.slice(1,3),16),
      parseInt(hex.slice(3,5),16),
      parseInt(hex.slice(5,7),16)
    ];
  }

  function rgbDistance(a,b){
    const A=hexToRgb(a), B=hexToRgb(b);
    return Math.sqrt((A[0]-B[0])**2 + (A[1]-B[1])**2 + (A[2]-B[2])**2);
  }

  function hslToHex(h,s,l){
    s/=100; l/=100;
    const c=(1-Math.abs(2*l-1))*s;
    const x=c*(1-Math.abs((h/60)%2-1));
    const m=l-c/2;
    let r=0,g=0,b=0;
    if(h<60)[r,g,b]=[c,x,0];
    else if(h<120)[r,g,b]=[x,c,0];
    else if(h<180)[r,g,b]=[0,c,x];
    else if(h<240)[r,g,b]=[0,x,c];
    else if(h<300)[r,g,b]=[x,0,c];
    else [r,g,b]=[c,0,x];
    return "#" + [r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
  }

  function randomSoftPalette(count=10){
    const result=[];
    const target=Math.max(10,count);
    const candidates=[];

    for(let h=0;h<360;h+=6){
      for(const s of [28,34,40,46]){
        for(const l of [74,79,84]){
          candidates.push(hslToHex(h,s,l));
        }
      }
    }

    let first=candidates[Math.floor(Math.random()*candidates.length)];
    result.push(first);

    while(result.length<target){
      let best=null,bestDist=-1;
      for(const c of candidates){
        if(result.includes(c)) continue;
        const d=Math.min(...result.map(r=>rgbDistance(c,r))) + Math.random()*5;
        if(d>bestDist){bestDist=d;best=c;}
      }
      result.push(best);
    }

    // Randomize order while retaining separation.
    return shuffled(result, Math.random);
  }

  function spreadPalette(colors){
    if(colors.length<=2) return [...colors];

    const remaining=[...colors];
    const ordered=[remaining.shift()];

    while(remaining.length){
      let bestIndex=0,bestDist=-1;
      for(let i=0;i<remaining.length;i++){
        const d=Math.min(...ordered.map(c=>rgbDistance(c,remaining[i])));
        if(d>bestDist){bestDist=d;bestIndex=i;}
      }
      ordered.push(remaining.splice(bestIndex,1)[0]);
    }
    return ordered;
  }

  function shuffled(arr,rnd=Math.random){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(rnd()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function refreshColourSequence(regenerateRandom=false){
    const p=paletteById(activePaletteId);
    if(p.id==='random'){
      if(regenerateRandom || !activeColourSequence.length){
        activeColourSequence=randomSoftPalette(Math.max(10,items.length));
      }
    } else {
      activeColourSequence=spreadPalette(p.colors);
    }
  }

  function colourForIndex(index){
    if(!activeColourSequence.length) refreshColourSequence(true);
    return activeColourSequence[index % activeColourSequence.length];
  }

  function applyActivePalette(){
    refreshColourSequence(true);
    items.forEach((item,i)=>item.color=colourForIndex(i));
    rebuild(true);
    renderPaletteControl();
  }

  function shuffleColours(){
    const p=paletteById(activePaletteId);

    if(p.id==='random'){
      activeColourSequence=randomSoftPalette(Math.max(10,items.length));
    } else {
      activeColourSequence=shuffled(p.colors);
    }

    items.forEach((item,i)=>item.color=colourForIndex(i));
    rebuild(true);
    renderPaletteControl();
  }

  function isValidHex(value){
    return /^#[0-9A-Fa-f]{6}$/.test(value);
  }

  function contrastTextColor(hex){
    const [r,g,b]=hexToRgb(hex).map(v=>v/255);
    const linear = v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
    const L = 0.2126*linear(r) + 0.7152*linear(g) + 0.0722*linear(b);
    return L > 0.42 ? '#111111' : '#ffffff';
  }

  function effectiveTextColor(item){
    const auto=contrastTextColor(item.color);
    return item.textMode==='invert'
      ? (auto==='#ffffff' ? '#111111' : '#ffffff')
      : auto;
  }

  function swatchesHtml(colors){
    const c=colors && colors.length ? colors : activeColourSequence;
    return (c || []).slice(0,10).map(x=>`<span class="swatch" style="background:${x}"></span>`).join('');
  }

  function renderPaletteControl(){
    refreshColourSequence(false);
    const p=paletteById(activePaletteId);
    paletteName.textContent=p.name;
    palettePreview.innerHTML=swatchesHtml(p.id==='random' ? activeColourSequence : p.colors);

    paletteMenu.innerHTML=PALETTES.map(option=>{
      let preview=option.colors;
      if(option.id==='random'){
        preview=['#E8C7CF','#F1D4B8','#EAE5B9','#CDE4C5','#BFE1DD','#C5D8EB','#D2CBEB','#E5CAE2','#D8D4C8','#C9DED0'];
      }
      return `
        <button class="paletteOption ${option.id===activePaletteId?'active':''}" data-palette="${option.id}">
          <div class="paletteOptionName">${option.name}</div>
          <div class="swatches">${swatchesHtml(preview)}</div>
        </button>`;
    }).join('');

    paletteMenu.querySelectorAll('.paletteOption').forEach(btn=>{
      btn.addEventListener('click',()=>{
        activePaletteId=btn.dataset.palette;
        paletteMenu.classList.remove('open');
        applyActivePalette();
      });
    });
  }

  paletteButton.addEventListener('click',e=>{
    e.stopPropagation();
    paletteMenu.classList.toggle('open');
  });

  document.addEventListener('click',e=>{
    if(!paletteMenu.contains(e.target) && !paletteButton.contains(e.target)){
      paletteMenu.classList.remove('open');
    }
    document.querySelectorAll('.colourPopover.open').forEach(p=>p.classList.remove('open'));
  });

  // ---------- deterministic RNG for geometry ----------
  function rngFactory(seed){
    let x=Math.floor(seed*2147483647)||1;
    return ()=>{
      x=x*16807%2147483647;
      return (x-1)/2147483646;
    };
  }

  // ---------- exact geometry ----------
  // Shape is determined only by area, so equal areas always match.
  // Perfect-square integer areas become exact squares.
  function buildGeometry(area){
    const exact=Math.max(0.01,Number(area)||0.01);
    const full=Math.floor(exact + 1e-9);
    const frac=Math.max(0,Math.min(0.999999,exact-full));
    const count=full + (frac>1e-8 ? 1 : 0);

    if(count<=1){
      return {width:1,height:1,cells:[{x:0,y:0,fraction:exact}]};
    }

    let best=null;
    for(let cols=1; cols<=count; cols++){
      const rows=Math.ceil(count/cols);
      const empty=cols*rows-count;
      const squarePenalty=Math.abs(cols-rows);
      // Prefer a square/near-square footprint, while keeping the exact
      // number of filled cells visible as a stepped edge where necessary.
      const score=squarePenalty + empty*0.4;
      if(!best || score<best.score){
        best={cols,rows,score};
      }
    }

    let cols=best.cols;
    let rows=best.rows;
    if(rows>cols) [cols,rows]=[rows,cols];

    const cells=[];
    for(let i=0;i<count;i++){
      const x=i%cols;
      const y=Math.floor(i/cols);
      let fraction=1;
      if(i===count-1 && frac>1e-8) fraction=frac;
      cells.push({x,y,fraction});
    }

    return {width:cols,height:rows,cells};
  }

  // ---------- data ----------
  function addItem(name="",area=20,color=null,rebuildNow=true){
    const id=nextId++;
    refreshColourSequence(false);

    items.push({
      id,
      name:name||`Room ${id}`,
      area:Math.max(.1,Math.round((Number(area)||.1)*10)/10),
      color:isValidHex(String(color||'')) ? String(color).toUpperCase() : colourForIndex(items.length),
      textMode:'auto'
    });

    layoutDirty=true;
    if(rebuildNow) rebuild(true);
  }

  function randomPaletteColour(){
    refreshColourSequence(false);
    if(!activeColourSequence.length) refreshColourSequence(true);
    return activeColourSequence[Math.floor(Math.random()*activeColourSequence.length)] || '#CCCCCC';
  }

  function parseCsvRows(text){
    const rows=[];
    let row=[];
    let field='';
    let quoted=false;

    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(quoted){
        if(ch==='"' && text[i+1]==='"'){
          field+='"';
          i++;
        }else if(ch==='"'){
          quoted=false;
        }else{
          field+=ch;
        }
      }else if(ch==='"'){
        quoted=true;
      }else if(ch===','){
        row.push(field);
        field='';
      }else if(ch==='\n'){
        row.push(field.replace(/\r$/,''));
        rows.push(row);
        row=[];
        field='';
      }else{
        field+=ch;
      }
    }

    row.push(field.replace(/\r$/,''));
    if(row.some(value=>value.trim()!=='')) rows.push(row);
    return rows;
  }

  function importCsv(text){
    const rows=parseCsvRows(text);
    let added=0;
    let skipped=0;

    for(const row of rows){
      if(row.every(value=>String(value).trim()==='')) continue;

      const name=String(row[0] ?? '').trim();
      const areaText=String(row[1] ?? '').trim();
      const area=Number(areaText);

      if(!name || !areaText || !Number.isFinite(area) || area<=0){
        skipped++;
        continue;
      }

      const requestedColour=String(row[2] ?? '').trim();
      const colour=isValidHex(requestedColour) ? requestedColour.toUpperCase() : randomPaletteColour();
      addItem(name,area,colour,false);
      added++;
    }

    if(added){
      layoutDirty=true;
      rebuild(true);
    }

    return {added,skipped};
  }

  function importSpreadsheetText(text){
    const rows=String(text||'').split(/\r?\n/);
    let added=0;
    let skipped=0;

    for(const line of rows){
      if(!line.trim()) continue;
      const row=line.split('\t');
      const name=String(row[0] ?? '').trim();
      const areaText=String(row[1] ?? '').trim();
      const area=Number(areaText);

      if(!name || !areaText || !Number.isFinite(area) || area<=0){
        skipped++;
        continue;
      }

      const requestedColour=String(row[2] ?? '').trim();
      const colour=isValidHex(requestedColour) ? requestedColour.toUpperCase() : randomPaletteColour();
      addItem(name,area,colour,false);
      added++;
    }

    if(added){
      layoutDirty=true;
      rebuild(true);
    }
    return {added,skipped};
  }

  function deleteItem(id){
    items=items.filter(i=>i.id!==id);
    layoutDirty=true;
    rebuild(true);
  }

  // ---------- packing ----------
  function getGap(){
    return Math.round(Math.max(0,Math.min(10,Number(gapNumber.value)||0))*10)/10;
  }

  function pack(){
    const gap=getGap();
    const rnd=rngFactory(shuffleSeed);
    const cloudMode=rnd()<0.5;

    let rooms=items.map(item=>({
      item,
      geometry:buildGeometry(item.area)
    }));

    rooms=shuffled(rooms,rnd);
    const placed=[];

    // Each room is a stack of contiguous horizontal strips, not dozens of
    // individual 1 m² rectangles. This represents the exact same stepped
    // geometry but makes collision testing dramatically cheaper.
    function localRects(room){
      if(room._rowRects) return room._rowRects;
      const rows=new Map();
      for(const px of room.geometry.cells){
        const end=px.x+px.fraction;
        rows.set(px.y,Math.max(rows.get(px.y)||0,end));
      }
      room._rowRects=[...rows.entries()].map(([y,w])=>({x:0,y,w,h:1}));
      return room._rowRects;
    }

    function worldRects(room,x=room.x,y=room.y){
      return localRects(room).map(r=>({x:x+r.x,y:y+r.y,w:r.w,h:r.h}));
    }

    function rectGapOkay(a,b){
      return (
        a.x+a.w+gap <= b.x + 1e-9 ||
        b.x+b.w+gap <= a.x + 1e-9 ||
        a.y+a.h+gap <= b.y + 1e-9 ||
        b.y+b.h+gap <= a.y + 1e-9
      );
    }

    function validPlacement(room,x,y){
      const candidate=worldRects(room,x,y);
      for(const p of placed){
        const existing=p._worldRects || (p._worldRects=worldRects(p));
        for(const a of candidate){
          for(const b of existing){
            if(!rectGapOkay(a,b)) return false;
          }
        }
      }
      return true;
    }

    function occupiedBounds(list){
      if(!list.length) return {minX:0,minY:0,maxX:0,maxY:0};
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
      for(const p of list){
        const rects=p._worldRects || worldRects(p);
        for(const r of rects){
          minX=Math.min(minX,r.x);
          minY=Math.min(minY,r.y);
          maxX=Math.max(maxX,r.x+r.w);
          maxY=Math.max(maxY,r.y+r.h);
        }
      }
      return {minX,minY,maxX,maxY};
    }

    function candidatePositions(room){
      if(!placed.length) return [{x:0,y:0}];

      const candidates=[];
      const local=localRects(room);

      for(const p of placed){
        const existing=p._worldRects || (p._worldRects=worldRects(p));

        // Use row edges rather than every individual cell edge.
        for(const a of local){
          for(const b of existing){
            candidates.push(
              {x:(b.x+b.w+gap)-a.x, y:b.y-a.y},
              {x:(b.x-gap)-(a.x+a.w), y:b.y-a.y},
              {x:b.x-a.x, y:(b.y+b.h+gap)-a.y},
              {x:b.x-a.x, y:(b.y-gap)-(a.y+a.h)}
            );
          }
        }
      }

      const unique=new Map();
      for(const c of candidates){
        const x=Math.max(0,c.x);
        const y=Math.max(0,c.y);
        const key=`${x.toFixed(3)},${y.toFixed(3)}`;
        if(!unique.has(key)) unique.set(key,{x,y});
      }

      // Score a bounded sample first. This keeps shuffle responsive even with
      // many rooms while preserving a large variety of possible layouts.
      let possible=shuffled([...unique.values()],rnd);
      if(possible.length>180) possible=possible.slice(0,180);
      possible=possible.filter(c=>validPlacement(room,c.x,c.y));

      if(possible.length) return possible;

      const b=occupiedBounds(placed);
      return [{x:b.maxX+gap,y:0}];
    }

    for(const room of rooms){
      const candidates=candidatePositions(room);
      let best=candidates[0];
      let bestScore=Infinity;

      for(const c of candidates){
        const test={...room,x:c.x,y:c.y};
        test._worldRects=worldRects(test);
        const bounds=occupiedBounds([...placed,test]);
        const width=bounds.maxX-bounds.minX;
        const height=bounds.maxY-bounds.minY;
        const area=width*height;
        const aspectPenalty=Math.abs(width-height);

        let score;
        if(cloudMode){
          const cx=(bounds.minX+bounds.maxX)/2;
          const cy=(bounds.minY+bounds.maxY)/2;
          const rcx=c.x+room.geometry.width/2;
          const rcy=c.y+room.geometry.height/2;
          const radius=Math.hypot(rcx-cx,rcy-cy);
          score=area*0.76 + radius*1.2 + rnd()*Math.max(2,area*0.16);
        }else{
          score=area + aspectPenalty*0.5 + rnd()*Math.max(1,area*0.035);
        }

        if(score<bestScore){
          bestScore=score;
          best=c;
        }
      }

      const placedRoom={...room,x:best.x,y:best.y};
      placedRoom._worldRects=worldRects(placedRoom);
      placed.push(placedRoom);
    }

    const bounds=occupiedBounds(placed);
    arrangement=placed;
    layoutBounds={maxX:bounds.maxX,maxY:bounds.maxY};
    layoutDirty=false;

    return {placed,maxX:bounds.maxX,maxY:bounds.maxY};
  }

  function ensureLayout(){
    if(layoutDirty || arrangement.length!==items.length) return pack();
    return {placed:arrangement,maxX:layoutBounds.maxX,maxY:layoutBounds.maxY};
  }

  // ---------- UI ----------
  function renderSidebar(){
    itemsEl.innerHTML="";

    items.forEach(item=>{
      const row=document.createElement('div');
      row.className='item';

      const tone=effectiveTextColor(item);

      row.innerHTML=`
        <div class="colourControl">
          <button class="colourSwatchBtn" title="Edit colour" aria-label="Edit colour">
            <div class="colourSwatchInner" style="background:${item.color}"></div>

            <input class="colourPicker" type="color" value="${item.color}" aria-label="Colour">

          </div>
        </div>
        <input class="nameInput" type="text" value="${escapeHtml(item.name)}" aria-label="Name">
        <div class="areaWrap">
          <input class="area" type="number" min="0.1" step="0.1" value="${Number(item.area).toFixed(1)}" aria-label="Area">

          <span class="textToneDot" style="background:${tone}"></span>

      `;

      const colour=row.querySelector('.colourPicker');
      const hex=row.querySelector('.hex');
      const name=row.querySelector('.nameInput');
      const area=row.querySelector('.area');
      const toneBtn=row.querySelector('.textToneBtn');
      const del=row.querySelector('.delete');

      colourButton.addEventListener('click',e=>{
        e.stopPropagation();
        document.querySelectorAll('.colourPopover.open').forEach(p=>{
          if(p!==colourPopover) p.classList.remove('open');
        });
        colourPopover.classList.toggle('open');
      });

      colourPopover.addEventListener('click',e=>e.stopPropagation());

      colour.addEventListener('input',e=>{
        item.color=e.target.value.toUpperCase();
        hex.value=item.color;
        colourInner.style.background=item.color;
        renderStage();
      });

      hex.addEventListener('input',e=>{
        let value=e.target.value.trim();
        if(value && !value.startsWith('#')) value='#'+value;
        e.target.value=value.toUpperCase();

        if(isValidHex(value)){
          item.color=value.toUpperCase();
          colour.value=item.color;
          colourInner.style.background=item.color;
          renderStage();
        }
      });

      hex.addEventListener('blur',()=>{
        if(!isValidHex(hex.value)) hex.value=item.color;
      });

      name.addEventListener('input',e=>{
        item.name=e.target.value;
        renderStage();
      });

      area.addEventListener('input',e=>{
        let value=e.target.value;
        if(value.includes('.')){
          const [whole,decimal]=value.split('.');
          if(decimal.length>1){
            value=whole+'.'+decimal.slice(0,1);
            e.target.value=value;
          }
        }
        item.area=Math.max(.1,Number(value)||.1);
        layoutDirty=true;
        renderStage();
      });

      area.addEventListener('blur',()=>{
        item.area=Math.max(.1,Math.round((Number(area.value)||.1)*10)/10);
        area.value=item.area.toFixed(1);
        layoutDirty=true;
        renderStage();
        saveLocalState();
      });

      toneBtn.addEventListener('click',()=>{
        item.textMode=item.textMode==='invert' ? 'auto' : 'invert';
        rebuild(true);
      });

      del.addEventListener('click',()=>deleteItem(item.id));

      itemsEl.appendChild(row);
    });
  }

  function renderStage(){
    [...stage.querySelectorAll('.room')].forEach(el=>el.remove());
    emptyState.style.display=items.length?'none':'grid';

    const cell=Number(cellInput.value);
    document.documentElement.style.setProperty('--cell',cell+'px');

    const {placed,maxX,maxY}=ensureLayout();

    stage.style.width=Math.max(700,(maxX+6)*cell)+'px';
    stage.style.height=Math.max(520,(maxY+6)*cell)+'px';

    for(const p of placed){
      const room=document.createElement('div');
      room.className='room';
      room.style.left=(p.x*cell)+'px';
      room.style.top=(p.y*cell)+'px';
      room.style.width=(p.geometry.width*cell)+'px';
      room.style.height=(p.geometry.height*cell)+'px';

      for(const px of p.geometry.cells){
        const el=document.createElement('div');
        el.className='pixel'+(displayGridInput.checked?' gridOn':'');
        if(displayGridInput.checked){
          const gridColour=invertGridInput.checked ? 'rgba(255,255,255,.42)' : 'rgba(35,35,35,.24)';
          el.style.borderRightColor=gridColour;
          el.style.borderBottomColor=gridColour;
        }
        el.style.left=(px.x*cell)+'px';
        el.style.top=(px.y*cell)+'px';
        el.style.width=(cell*px.fraction)+'px';
        el.style.height=cell+'px';
        el.style.background=p.item.color;
        room.appendChild(el);
      }

      if(displayTextInput.checked){
        const label=document.createElement('div');
        label.className='roomLabel';
        label.style.color=effectiveTextColor(p.item);
        label.innerHTML=`
          <div>
            <div class="name">${escapeHtml(p.item.name)}</div>
            <div class="sqm">${formatArea(p.item.area)} m²</div>
          </div>`;
        room.appendChild(label);
      }

      stage.appendChild(room);
    }

    saveLocalState();
  }

  function rebuild(sidebar=false){
    if(sidebar) renderSidebar();
    renderStage();
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g,m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  function escapeXml(str){return escapeHtml(str)}

  function formatArea(n){
    return Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:1});
  }

  function safeName(s){
    return String(s||"item")
      .trim()
      .replace(/[^\w\-]+/g,'_')
      .replace(/^_+|_+$/g,'')||'item';
  }

  // ---------- state ----------
  function currentState(){
    return {
      version:STATE_VERSION,
      savedAt:new Date().toISOString(),
      items:items.map(item=>({
        id:item.id,
        name:item.name,
        area:item.area,
        color:item.color,
        textMode:item.textMode
      })),
      nextId,
      shuffleSeed,
      activePaletteId,
      activeColourSequence:[...activeColourSequence],
      settings:{
        gap:getGap(),
        cellSize:Number(cellInput.value),
        displayGrid:displayGridInput.checked,
        invertGrid:invertGridInput.checked,
        displayText:displayTextInput.checked,
        exportGrid:exportGridInput.checked,
        exportText:exportTextInput.checked,
        nightMode:document.body.classList.contains('night')
      }
    };
  }

  function saveLocalState(){
    if(restoringState) return;
    try{
      localStorage.setItem(STATE_KEY,JSON.stringify(currentState()));
    }catch(err){
      console.warn('Could not autosave state',err);
    }
  }

  function applyState(state){
    if(!state || typeof state!=='object' || !Array.isArray(state.items)){
      throw new Error('Invalid Area Blocks state file');
    }

    restoringState=true;
    try{
      items=state.items.map((item,index)=>({
        id:Number.isFinite(Number(item.id)) ? Number(item.id) : index+1,
        name:String(item.name ?? `Room ${index+1}`),
        area:Math.max(.1,Math.round((Number(item.area)||.1)*10)/10),
        color:isValidHex(String(item.color||'')) ? String(item.color).toUpperCase() : '#CCCCCC',
        textMode:item.textMode==='invert' ? 'invert' : 'auto'
      }));

      const highestId=items.reduce((m,item)=>Math.max(m,item.id),0);
      nextId=Math.max(highestId+1,Number(state.nextId)||1);
      shuffleSeed=Number.isFinite(Number(state.shuffleSeed)) ? Number(state.shuffleSeed) : Math.random();
      activePaletteId=paletteById(state.activePaletteId).id;
      activeColourSequence=Array.isArray(state.activeColourSequence)
        ? state.activeColourSequence.filter(isValidHex).map(c=>c.toUpperCase())
        : [];

      const settings=state.settings || {};
      const gap=Math.max(0,Math.min(10,Number(settings.gap ?? 2)));
      gapSlider.value=gap.toFixed(1);
      gapNumber.value=gap.toFixed(1);

      const cell=Math.max(10,Math.min(30,Number(settings.cellSize ?? 18)));
      cellInput.value=String(Math.round(cell));
      cellValue.textContent=cellInput.value+' px';

      displayGridInput.checked=!!settings.displayGrid;
      invertGridInput.checked=!!settings.invertGrid;
      displayTextInput.checked=settings.displayText!==false;
      exportGridInput.checked=!!settings.exportGrid;
      exportTextInput.checked=!!settings.exportText;
      document.body.classList.toggle('night',!!settings.nightMode);
      themeToggle.textContent=document.body.classList.contains('night') ? '☀' : '◐';

      arrangement=[];
      layoutBounds={maxX:0,maxY:0};
      layoutDirty=true;
      refreshColourSequence(false);
      renderPaletteControl();
      rebuild(true);
    }finally{
      restoringState=false;
    }
    saveLocalState();
  }

  function loadLocalState(){
    try{
      const raw=localStorage.getItem(STATE_KEY);
      if(!raw) return false;
      applyState(JSON.parse(raw));
      return true;
    }catch(err){
      console.warn('Could not restore saved state',err);
      return false;
    }
  }

  // ---------- SVG ----------
  const EXPORT_CELL=20;

  function measureTextWidth(text,font){
    const canvas=measureTextWidth.canvas || (measureTextWidth.canvas=document.createElement('canvas'));
    const ctx=canvas.getContext('2d');
    ctx.font=font;
    return ctx.measureText(text).width;
  }

  function wrapSvgText(text,maxWidth,font){
    const words=String(text).trim().split(/\s+/).filter(Boolean);
    if(!words.length) return [''];

    const lines=[];
    let line='';

    for(const word of words){
      const test=line ? `${line} ${word}` : word;
      if(!line || measureTextWidth(test,font)<=maxWidth){
        line=test;
        continue;
      }

      lines.push(line);
      line=word;

      // Match normal browser wrapping for ordinary words, but prevent a single
      // exceptionally long token from overflowing the exported room.
      if(measureTextWidth(line,font)>maxWidth){
        let chunk='';
        const chars=[];
        for(const ch of line){
          const testChunk=chunk+ch;
          if(chunk && measureTextWidth(testChunk,font)>maxWidth){
            chars.push(chunk);
            chunk=ch;
          }else{
            chunk=testChunk;
          }
        }
        if(chunk) chars.push(chunk);
        lines.push(...chars.slice(0,-1));
        line=chars.at(-1) || '';
      }
    }

    if(line) lines.push(line);
    return lines;
  }

  function svgLabel(item,w,h){
    if(!exportTextInput.checked) return "";

    // Mirror the on-screen .roomLabel typography. The export uses a fixed
    // 20 px cell, so scale the UI's pixel typography by the same cell ratio.
    const displayCell=Math.max(1,Number(cellInput.value)||18);
    const scale=EXPORT_CELL/displayCell;
    const nameSize=14*scale;
    const sqmSize=12*scale;
    const lineHeight=14*1.35*scale;
    const padding=7*scale;
    const sqmGap=2*scale;
    const maxWidth=Math.max(1,w-padding*2);
    const family='Inter, Arial, Helvetica, sans-serif';
    const nameFont=`650 ${nameSize}px Inter, Arial, Helvetica, sans-serif`;
    const nameLines=wrapSvgText(item.name,maxWidth,nameFont);
    const nameHeight=nameLines.length*lineHeight;
    const totalHeight=nameHeight+sqmGap+sqmSize*1.35;
    const startY=(h-totalHeight)/2 + lineHeight/2;
    const x=w/2;
    const fill=effectiveTextColor(item);

    const nameMarkup=nameLines.map((line,i)=>
      `<tspan x="${x}" y="${startY+i*lineHeight}">${escapeXml(line)}</tspan>`
    ).join('');

    const sqmY=startY+(nameLines.length-1)*lineHeight+lineHeight/2+sqmGap+(sqmSize*1.35)/2;

    return `
      <text text-anchor="middle" dominant-baseline="central"
        font-family="${family}" font-size="${nameSize}" font-weight="650" fill="${fill}">
        ${nameMarkup}
      </text>
      <text x="${x}" y="${sqmY}"
        text-anchor="middle" dominant-baseline="central"
        font-family="${family}" font-size="${sqmSize}" fill="${fill}" opacity=".72">${escapeXml(formatArea(item.area))} m²</text>`;
  }

  function svgShapeLayer(p){
    return p.geometry.cells.map(px=>{
      const x=px.x*EXPORT_CELL;
      const y=px.y*EXPORT_CELL;
      const w=px.fraction*EXPORT_CELL;
      return `<rect x="${x}" y="${y}" width="${w}" height="${EXPORT_CELL}" fill="${p.item.color}"/>`;
    }).join('');
  }

  function svgGridLayer(p){
    if(!exportGridInput.checked) return "";

    return p.geometry.cells.map(px=>{
      const x=px.x*EXPORT_CELL;
      const y=px.y*EXPORT_CELL;
      const w=px.fraction*EXPORT_CELL;
      const stroke=invertGridInput.checked ? "#ffffff" : "#555555";
      const opacity=invertGridInput.checked ? "0.48" : "0.30";
      return `<rect x="${x}" y="${y}" width="${w}" height="${EXPORT_CELL}" fill="none" stroke="${stroke}" stroke-opacity="${opacity}" stroke-width="0.5"/>`;
    }).join('');
  }

  function individualSvg(p){
    const w=p.geometry.width*EXPORT_CELL;
    const h=p.geometry.height*EXPORT_CELL;

    return `<svg xmlns="http://www.w3.org/2000/svg"
      width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <g id="shape" data-layer="shape">
        ${svgShapeLayer(p)}
      </g>
      <g id="grid" data-layer="grid">
        ${svgGridLayer(p)}
      </g>
      <g id="text" data-layer="text">
        ${svgLabel(p.item,w,h)}
      </g>
    </svg>`;
  }

  function togetherSvg(){
    ensureLayout();

    let maxX=0,maxY=0;

    for(const p of arrangement){
      maxX=Math.max(maxX,p.x+p.geometry.width);
      maxY=Math.max(maxY,p.y+p.geometry.height);
    }

    const width=maxX*EXPORT_CELL;
    const height=maxY*EXPORT_CELL;

    const shapeGroups=arrangement.map(p=>{
      const tx=p.x*EXPORT_CELL;
      const ty=p.y*EXPORT_CELL;
      return `<g transform="translate(${tx} ${ty})">${svgShapeLayer(p)}</g>`;
    }).join('');

    const gridGroups=arrangement.map(p=>{
      if(!exportGridInput.checked) return "";
      const tx=p.x*EXPORT_CELL;
      const ty=p.y*EXPORT_CELL;
      return `<g transform="translate(${tx} ${ty})">${svgGridLayer(p)}</g>`;
    }).join('');

    const textGroups=arrangement.map(p=>{
      if(!exportTextInput.checked) return "";
      const tx=p.x*EXPORT_CELL;
      const ty=p.y*EXPORT_CELL;
      const w=p.geometry.width*EXPORT_CELL;
      const h=p.geometry.height*EXPORT_CELL;
      return `<g transform="translate(${tx} ${ty})">${svgLabel(p.item,w,h)}</g>`;
    }).join('');

    return `<svg xmlns="http://www.w3.org/2000/svg"
      width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
      <g id="shape" data-layer="shape">
        ${shapeGroups}
      </g>
      <g id="grid" data-layer="grid">
        ${gridGroups}
      </g>
      <g id="text" data-layer="text">
        ${textGroups}
      </g>
    </svg>`;
  }

  function downloadText(filename,text,type="image/svg+xml"){
    const blob=new Blob([text],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }


  async function svgToJpgBlob(svgText, background="#ffffff", scale=2){
    return new Promise((resolve,reject)=>{
      const svgBlob=new Blob([svgText],{type:"image/svg+xml;charset=utf-8"});
      const url=URL.createObjectURL(svgBlob);
      const img=new Image();

      img.onload=()=>{
        try{
          const vb=img.width && img.height
            ? {w:img.width,h:img.height}
            : {w:1200,h:800};

          const canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.round(vb.w*scale));
          canvas.height=Math.max(1,Math.round(vb.h*scale));

          const ctx=canvas.getContext('2d');
          ctx.scale(scale,scale);
          ctx.fillStyle=background;
          ctx.fillRect(0,0,vb.w,vb.h);
          ctx.drawImage(img,0,0,vb.w,vb.h);

          URL.revokeObjectURL(url);
          canvas.toBlob(blob=>{
            if(blob) resolve(blob);
            else reject(new Error("Could not create JPG"));
          },"image/jpeg",0.95);
        }catch(err){
          URL.revokeObjectURL(url);
          reject(err);
        }
      };

      img.onerror=()=>{
        URL.revokeObjectURL(url);
        reject(new Error("Could not render SVG"));
      };

      img.src=url;
    });
  }

  function downloadBlob(filename,blob){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  // ---------- ZIP ----------
  const crcTable=(()=>{
    const table=new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c=(c&1) ? (0xEDB88320^(c>>>1)) : (c>>>1);
      table[n]=c>>>0;
    }
    return table;
  })();

  function crc32(bytes){
    let c=0xFFFFFFFF;
    for(const b of bytes) c=crcTable[(c^b)&0xFF]^(c>>>8);
    return (c^0xFFFFFFFF)>>>0;
  }

  function zipDateTime(date=new Date()){
    const year=Math.max(1980,date.getFullYear());
    return {
      time:(date.getHours()<<11)|(date.getMinutes()<<5)|(date.getSeconds()>>1),
      date:((year-1980)<<9)|((date.getMonth()+1)<<5)|date.getDate()
    };
  }

  function push16(out,n){out.push(n&255,(n>>>8)&255);}
  function push32(out,n){out.push(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255);}

  async function makeZip(files){
    const enc=new TextEncoder();
    const local=[];
    const central=[];
    let offset=0;
    const stamp=zipDateTime();

    for(const file of files){
      const name=enc.encode(file.name);
      const data=file.data instanceof Uint8Array
        ? file.data
        : new Uint8Array(await file.data.arrayBuffer());
      const crc=crc32(data);

      const header=[];
      push32(header,0x04034b50);
      push16(header,20);
      push16(header,0x0800);
      push16(header,0);
      push16(header,stamp.time);
      push16(header,stamp.date);
      push32(header,crc);
      push32(header,data.length);
      push32(header,data.length);
      push16(header,name.length);
      push16(header,0);
      local.push(new Uint8Array(header),name,data);

      const c=[];
      push32(c,0x02014b50);
      push16(c,20);
      push16(c,20);
      push16(c,0x0800);
      push16(c,0);
      push16(c,stamp.time);
      push16(c,stamp.date);
      push32(c,crc);
      push32(c,data.length);
      push32(c,data.length);
      push16(c,name.length);
      push16(c,0);
      push16(c,0);
      push16(c,0);
      push16(c,0);
      push32(c,0);
      push32(c,offset);
      central.push(new Uint8Array(c),name);

      offset+=header.length+name.length+data.length;
    }

    const centralSize=central.reduce((sum,p)=>sum+p.length,0);
    const end=[];
    push32(end,0x06054b50);
    push16(end,0);
    push16(end,0);
    push16(end,files.length);
    push16(end,files.length);
    push32(end,centralSize);
    push32(end,offset);
    push16(end,0);

    return new Blob([...local,...central,new Uint8Array(end)],{type:'application/zip'});
  }

  // ---------- events ----------
  document.getElementById('addBtn').addEventListener('click',()=>{
    const randomArea=Math.floor(Math.random()*61)+20;
    addItem("",randomArea);
  });

  document.getElementById('shuffleBtn').addEventListener('click',()=>{
    shuffleSeed=Math.random();
    layoutDirty=true;
    renderStage();
  });

  document.getElementById('shuffleColoursBtn').addEventListener('click',shuffleColours);

  document.getElementById('clearBtn').addEventListener('click',()=>{
    items=[];
    arrangement=[];
    layoutBounds={maxX:0,maxY:0};
    layoutDirty=true;
    rebuild(true);
  });

  function setGap(value,source){
    const v=Math.round(Math.max(0,Math.min(10,Number(value)||0))*10)/10;
    if(source!=='slider') gapSlider.value=v.toFixed(1);
    if(source!=='number') gapNumber.value=v.toFixed(1);
    layoutDirty=true;
    renderStage();
  }

  gapSlider.addEventListener('input',()=>setGap(gapSlider.value,'slider'));
  gapNumber.addEventListener('input',()=>setGap(gapNumber.value,'number'));
  gapNumber.addEventListener('blur',()=>setGap(gapNumber.value,''));

  cellInput.addEventListener('input',()=>{
    cellValue.textContent=cellInput.value+' px';
    renderStage();
  });

  displayGridInput.addEventListener('change',renderStage);
  invertGridInput.addEventListener('change',renderStage);
  displayTextInput.addEventListener('change',renderStage);
  exportGridInput.addEventListener('change',saveLocalState);
  exportTextInput.addEventListener('change',saveLocalState);

  const loadStateInput=document.getElementById('loadStateInput');
  const importCsvInput=document.getElementById('importCsvInput');
  const pasteSpreadsheetDialog=document.getElementById('pasteSpreadsheetDialog');
  const pasteSpreadsheetText=document.getElementById('pasteSpreadsheetText');

  document.getElementById('pasteSpreadsheetBtn').addEventListener('click',()=>{
    pasteSpreadsheetText.value='';
    pasteSpreadsheetDialog.showModal();
    setTimeout(()=>pasteSpreadsheetText.focus(),0);
  });

  document.getElementById('cancelPasteBtn').addEventListener('click',()=>pasteSpreadsheetDialog.close());

  document.getElementById('importPasteBtn').addEventListener('click',()=>{
    const result=importSpreadsheetText(pasteSpreadsheetText.value);
    if(!result.added){
      alert('No rooms were imported. Copy spreadsheet columns in this order: room name, area, optional #RRGGBB colour. Do not include headings.');
      return;
    }
    pasteSpreadsheetDialog.close();
    if(result.skipped){
      alert(`Imported ${result.added} room${result.added===1?'':'s'}. Skipped ${result.skipped} invalid row${result.skipped===1?'':'s'}.`);
    }
  });

  document.getElementById('importCsvBtn').addEventListener('click',()=>{
    importCsvInput.value='';
    importCsvInput.click();
  });

  importCsvInput.addEventListener('change',async()=>{
    const file=importCsvInput.files && importCsvInput.files[0];
    if(!file) return;
    try{
      const result=importCsv(await file.text());
      if(!result.added){
        alert('No rooms were imported. Use: room name, area, optional #RRGGBB colour. Do not include a header row.');
      }else if(result.skipped){
        alert(`Imported ${result.added} room${result.added===1?'':'s'}. Skipped ${result.skipped} invalid row${result.skipped===1?'':'s'}.`);
      }
    }catch(err){
      console.error(err);
      alert('Could not import this CSV file.');
    }
  });

  document.getElementById('saveStateBtn').addEventListener('click',()=>{
    const json=JSON.stringify(currentState(),null,2);
    downloadText('area-blocks-state.json',json,'application/json');
  });

  document.getElementById('loadStateBtn').addEventListener('click',()=>{
    loadStateInput.value='';
    loadStateInput.click();
  });

  document.getElementById('resetAppBtn').addEventListener('click',()=>{
    const confirmed=confirm('Reset the app to its default state? This will replace your locally saved session.');
    if(!confirmed) return;
    try{
      localStorage.removeItem(STATE_KEY);
    }catch(err){
      console.warn('Could not clear saved state',err);
    }
    location.reload();
  });

  loadStateInput.addEventListener('change',async()=>{
    const file=loadStateInput.files && loadStateInput.files[0];
    if(!file) return;
    try{
      applyState(JSON.parse(await file.text()));
    }catch(err){
      console.error(err);
      alert('Could not load this state file.');
    }
  });

  document.getElementById('exportTogether').addEventListener('click',()=>{
    if(!items.length) return;
    downloadText('area-blocks-layout.svg',togetherSvg());
  });

  document.getElementById('exportSeparate').addEventListener('click',async()=>{
    if(!items.length) return;
    ensureLayout();

    const enc=new TextEncoder();
    const files=arrangement.map((p,i)=>({
      name:`${String(i+1).padStart(2,'0')}_${safeName(p.item.name)}.svg`,
      data:enc.encode(individualSvg(p))
    }));

    const zip=await makeZip(files);
    downloadBlob('area-blocks-separate-svg.zip',zip);
  });

  document.getElementById('exportTogetherJpg').addEventListener('click',async()=>{
    if(!items.length) return;
    const svg=togetherSvg();
    const bg=document.body.classList.contains('night') ? '#1b2532' : '#ffffff';
    try{
      const blob=await svgToJpgBlob(svg,bg,2);
      downloadBlob('area-blocks-layout.jpg',blob);
    }catch(err){
      console.error(err);
    }
  });

  document.getElementById('exportSeparateJpg').addEventListener('click',async()=>{
    if(!items.length) return;
    ensureLayout();
    const bg=document.body.classList.contains('night') ? '#1b2532' : '#ffffff';
    const files=[];

    for(let i=0;i<arrangement.length;i++){
      const p=arrangement[i];
      try{
        const blob=await svgToJpgBlob(individualSvg(p),bg,2);
        files.push({
          name:`${String(i+1).padStart(2,'0')}_${safeName(p.item.name)}.jpg`,
          data:blob
        });
      }catch(err){
        console.error(err);
      }
    }

    if(!files.length) return;
    const zip=await makeZip(files);
    downloadBlob('area-blocks-separate-jpg.zip',zip);
  });


  // ---------- sidebar resize ----------
  const resizer=document.getElementById('resizer');
  let resizing=false;

  resizer.addEventListener('mousedown',()=>{
    resizing=true;
    document.body.style.userSelect='none';
    document.body.style.cursor='col-resize';
  });

  window.addEventListener('mousemove',e=>{
    if(!resizing) return;
    const width=Math.max(300,Math.min(700,e.clientX));
    document.documentElement.style.setProperty('--sidebar',width+'px');
  });

  window.addEventListener('mouseup',()=>{
    resizing=false;
    document.body.style.userSelect='';
    document.body.style.cursor='';
  });

  // ---------- night mode ----------
  const themeToggle=document.getElementById('themeToggle');
  themeToggle.addEventListener('click',()=>{
    document.body.classList.toggle('night');
    themeToggle.textContent=document.body.classList.contains('night') ? '☀' : '◐';
    saveLocalState();
  });

  // Restore the most recent browser state, otherwise use starter examples.
  if(!loadLocalState()){
    refreshColourSequence(true);
    renderPaletteControl();
    addItem('Room 1',20);
    addItem('Room 2',20);
    addItem('Room 3',20);
  }
})();
</script>
